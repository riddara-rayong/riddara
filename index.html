<!DOCTYPE html>
<html lang="th">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลงเวลาริดดารา">
<meta name="theme-color" content="#0d6b66">
<title>ลงเวลาเซลส์ ริดดารา</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f6f6; --surface:#fff; --sunk:#e8eeee; --line:#d4dddd; --fg:#14201f; --muted:#5b6b6a;
  --accent:#0d6b66; --accent-fg:#fff; --duty:#9a5a00; --duty-bg:#fff0d4; --norm:#0d6b66; --norm-bg:#dff2ef;
  --off:#6b7473; --off-bg:#eceeee; --leave:#6b46c1; --leave-bg:#eee8fb; --booth:#1f5fae; --booth-bg:#e3eefc;
  --we-bg:#fbeee9; --ok:#1d7a3a; --bad:#c0362c; --bad-bg:#fde7e4;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1716; --surface:#16211f; --sunk:#1c2927; --line:#2b3b39; --fg:#e5eeed; --muted:#93a5a3;
  --accent:#3cc2b8; --accent-fg:#06201e; --duty:#f2a83b; --duty-bg:#3a2a10; --norm:#4fd1c5; --norm-bg:#12332f;
  --off:#9aa6a5; --off-bg:#232e2d; --leave:#b39af2; --leave-bg:#2a2340; --booth:#8ab8ff; --booth-bg:#16263d;
  --we-bg:#231b1a; --ok:#5ccf7d; --bad:#ff7b6e; --bad-bg:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 6px}
.brand b{font-size:17px;display:block}.brand span{font-size:13px;color:var(--bad);font-weight:600}
.clock{text-align:right;font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.clock small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
main{padding-block:16px 48px}
h2{font-size:19px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
button.btn,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-duty{background:var(--duty-bg);color:var(--duty)}.t-norm{background:var(--norm-bg);color:var(--norm)}
.t-off{background:var(--off-bg);color:var(--off)}.t-leave{background:var(--leave-bg);color:var(--leave)}.t-booth{background:var(--booth-bg);color:var(--booth)}
.late{color:var(--bad);font-weight:600}.good{color:var(--ok);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.me-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.today-type{border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.today-type.duty{background:var(--duty-bg);border-color:var(--duty);color:var(--duty)}
.today-type.norm{background:var(--norm-bg);border-color:var(--norm);color:var(--norm)}
.today-type .big{font-size:26px;font-weight:700;line-height:1.25}
.today-type .note{color:inherit;opacity:.85}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.times div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.times span{display:block;font-size:12px;color:var(--muted)}
.times output{font-family:var(--f-mono);font-size:24px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:16px 8px;font-size:17px}
.acts2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.split>div{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.split .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.split .who{font-size:20px;font-weight:700}
.split .duty{background:var(--duty-bg);border-color:var(--duty)}.split .duty .lbl,.split .duty .who{color:var(--duty)}
.split .norm{background:var(--norm-bg);border-color:var(--norm)}.split .norm .lbl,.split .norm .who{color:var(--norm)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;font-size:14px}
thead th{background:var(--sunk);font-size:12px;color:var(--muted);text-align:center}
tr.we td{background:var(--we-bg)} tr.today td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
td.dc{background:var(--duty-bg)!important} td.num,th.num{text-align:right;font-family:var(--f-mono)} td.g,th.g{border-left:2px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:92vw;text-align:center}
#msg{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600}
#msg.err{background:var(--bad-bg);color:var(--bad)}#msg.ok{background:var(--norm-bg);color:var(--norm)}
.h3{font-size:16px;margin:0 0 4px}
.photo-row{margin-bottom:8px}
.thumb{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.shop-h{font-size:16px;margin:4px 0 8px;color:var(--accent)}
tr.grp td{background:var(--sunk);font-weight:700;color:var(--accent)}
label.row input[type=checkbox]{flex:0 0 auto}
.lbl2{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
select.full{width:100%}
.cover{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cover-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="brand"><b id="brand">ฝ่ายขาย โชว์รูมริดดารา</b><span id="rule">เวรเข้าไม่เกิน 08:10 น.</span></div>
    <div class="clock"><small>เวลาเข้างาน (ตามเครื่องสแกน)</small><span id="clk">--:--</span><small id="clk2"></small></div>
  </div>
  <nav>
    <button data-v="me">ลงเวลา</button><button data-v="team">ทีมวันนี้</button><button data-v="sheet">ใบเวร</button><button data-v="sum">สรุปรอบ</button><button data-v="admin">ผู้จัดการ</button>
  </nav>
</div></header>
<main class="wrap">
  <div id="msg" hidden></div>
  <section id="v-me"></section>
  <section id="v-team" hidden></section>
  <section id="v-sheet" hidden>
    <div class="row" id="shopTabs" style="margin-bottom:10px"></div>
    <div class="row" style="margin-bottom:10px"><button class="btn" id="pPrev" aria-label="รอบก่อน">‹</button><b id="pLbl" style="min-width:190px;text-align:center"></b><button class="btn" id="pNext" aria-label="รอบถัดไป">›</button></div>
    <p class="sub">ช่องเหลือง = คนเป็นเวร ผู้จัดการแก้เวรและสลับเวรได้ในแท็บ "ตารางเวร" ของ Google Sheet แก้เวลาได้ในแท็บ "ลงเวลา"</p>
    <div class="scroll"><table id="sheetTbl"></table></div>
  </section>
  <section id="v-sum" hidden>
    <h2>สรุปท้ายรอบ</h2><p class="sub" id="sumLbl"></p>
    <div class="scroll"><table id="sumTbl"></table></div>
  </section>
  <section id="v-admin" hidden></section>
</main>
<div id="toast" hidden></div>

<script>
const TH_DF=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"],TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const STATUS={"ออกบูธ":"t-booth","หยุด":"t-off","ลา":"t-leave"};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(x==="value"||x==="checked")e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v===true?"":v)}for(const c of k.flat(Infinity)){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const API="https://script.google.com/macros/s/AKfycbxwmAShTNwSR1c3eweVz-QCGNQ7vhB5cWdA3rAiR9YA6bVofZFYupX_9S4HK6PhwT8/exec";
async function run(fn,...a){
  const body=fn==="getState"?{action:fn,period:a[0]}:fn==="punch"||fn==="swapDuty"?{action:fn,data:a[0]}:fn==="adminSetLocation"?{action:fn,pin:a[0],lat:a[1],lng:a[2]}:{action:fn,pin:a[0],period:a[1],first:a[2]};
  let r;try{r=await fetch(API,{method:"POST",body:JSON.stringify(body),credentials:"omit",redirect:"follow"})}catch(e){throw new Error("เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่")}
  let j;try{j=await r.json()}catch(e){throw new Error("ระบบตอบกลับผิดปกติ ลองใหม่อีกครั้ง")}
  if(!j.ok)throw new Error(j.error||"เกิดข้อผิดพลาด");return j.data}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3500)}
function msg(m,ok){const b=$("#msg");b.textContent=m||"";b.className=ok?"ok":"err";b.hidden=!m;if(m)window.scrollTo({top:0,behavior:"smooth"})}
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+b};
const dt=s=>new Date(s+"T00:00:00");
const thShort=s=>{const d=dt(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()+543).slice(2)}`};
const dayName=s=>TH_DF[dt(s).getDay()];
const shiftP=(p,k)=>{const[y,m]=p.split("-").map(Number);const d=new Date(y,m-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const pLabel=p=>{const[y,m]=p.split("-").map(Number);const s=new Date(y,m-2,26);return `รอบ 26 ${TH_M[s.getMonth()]} – 25 ${TH_M[m-1]} ${y+543}`};

let S=null,view="me",drift=0,busy=false,pendKind=null,photoData=null;
const photoLink=x=>x.photo&&/^https:\/\//.test(x.photo)?[" ",el("a",{href:x.photo,target:"_blank",rel:"noopener"},"ดูรูป")]:null;
/* shrink a picked photo to max 1280px JPEG before upload */
async function loadPhoto(file){if(!file)return;try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL("image/jpeg",0.7);URL.revokeObjectURL(url)}catch(e){msg("อ่านรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง")}renderMe()}
const KLABEL={booth:"ออกบูธ",off:"หยุด",leave:"ลา"};
const PH={booth:"บูธที่ไหน เช่น เซ็นทรัลระยอง",off:"เหตุผลที่หยุด เช่น ธุระส่วนตัว",leave:"เหตุผลที่ลา เช่น ลาป่วย"};
/* day-off quota per pay cycle (column F in the staff sheet); manager weekend auto-off doesn't count */
const offUsed=name=>S.days.filter(d=>{const x=day(name,d);return x.status==="หยุด"&&!x.auto}).length;
const me=()=>LS.get("rd-me")||"";
/* two showrooms, each with its own duty roster */
const SHOPS=["ริดดารา","ฮุนได"];
let sheetShop=SHOPS[0];
const shopOf=n=>(S.staff.find(s=>s.name===n)||{}).shop||SHOPS[0];
const staffOf=shop=>S.staff.filter(s=>s.shop===shop);
const RS=shop=>(S.roster&&S.roster[shop])||{};
const dutyOn=(d,shop)=>{const r=RS(shop)[d];return r?(r.actual||r.sched||""):""};
const isMgr=s=>!!s&&s.role==="ผู้จัดการ";
const fullName=s=>isMgr(s)?`${s.name} (ผู้จัดการ)`:s.name;
function staffSelect(attrs,selected,blank){return el("select",attrs,blank?el("option",{value:""},blank):null,
  SHOPS.map(sh=>el("optgroup",{label:"โชว์รูม"+sh},staffOf(sh).map(s=>el("option",{value:s.name,selected:s.name===selected},fullName(s))))))}
function day(name,date){const st={in:"",out:"",status:"",note:""};for(const r of S.log){if(r.date!==date||r.name!==name)continue;
  if(r.kind==="เข้างาน")st.in=r.time;else if(r.kind==="ออกงาน")st.out=r.time;else if(r.kind==="ยกเลิก"){st.status="";st.note=""}else if(STATUS[r.kind]){st.status=r.kind;st.note=r.note;st.photo=r.photo||""}}
  /* managers are off on Sat/Sun unless they clock in */
  if(!st.in&&!st.status&&date<=S.today&&[0,6].includes(dt(date).getDay())&&isMgr(S.staff.find(s=>s.name===name))){st.status="หยุด";st.note="เสาร์–อาทิตย์";st.auto=true}
  return st}
const isWeekday=d=>{const w=dt(d).getDay();return w>=1&&w<=5};
function lateMin(name,date){const x=day(name,date);if(!x.in)return 0;let lim;
  if(isMgr(S.staff.find(s=>s.name===name)))lim=S.settings.mgrDeadline||"09:00";else if(dutyOn(date,shopOf(name))===name)lim=S.settings.deadline;
  else lim=S.settings.normDeadline||"08:30";
  const d=toMin(x.in)-toMin(lim);return d>0?d:0}
function nextDuty(name){const sh=shopOf(name);return Object.keys(RS(sh)).sort().find(d=>d>S.today&&dutyOn(d,sh)===name)||null}
function rel(d){const n=Math.round((dt(d)-dt(S.today))/864e5);const w=`${dayName(d)} ${dt(d).getDate()} ${TH_M[dt(d).getMonth()]}`;return n===1?`พรุ่งนี้ (${w})`:`วัน${w} · อีก ${n} วัน`}

async function load(p){try{S=await run("getState",p||null);drift=S.serverNow-Date.now();render()}catch(e){msg("โหลดข้อมูลไม่ได้: "+e.message)}}
function go(v){view=v;document.querySelectorAll("nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v===v));document.querySelectorAll("nav button[aria-current]").forEach(b=>b.setAttribute("aria-current","page"));
  ["me","team","sheet","sum","admin"].forEach(x=>{const e=$("#v-"+x);if(e)e.hidden=x!==v});render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

/* the team started using the app on 27 Nov 2026: earlier days are not shown or counted */
const START_DATE="2026-11-27";
function render(){if(!S)return;if(S.days)S.days=S.days.filter(d=>d>=START_DATE);if(typeof VIEW_ONLY!=="undefined"&&VIEW_ONLY&&(view==="me"||view==="admin"))view="team";$("#brand").textContent=S.settings.name||"ฝ่ายขาย โชว์รูมริดดารา";
  $("#rule").textContent=`เวรเข้าไม่เกิน ${S.settings.deadline} น.`;
  ({me:renderMe,team:renderTeam,sheet:renderSheet,sum:renderSum,admin:renderAdmin})[view]();if(typeof VIEW_ONLY!=="undefined"&&VIEW_ONLY)$("#rule").textContent="ดูอย่างเดียว · "+$("#rule").textContent.replace(/^ดูอย่างเดียว · /,"")}

/* ---------- my clock-in ---------- */
function renderMe(){
  const box=$("#v-me");const keep={};box.querySelectorAll("input[id]:not([type=file]),select[id^=sw]").forEach(i=>keep[i.id]=i.value);box.replaceChildren();
  const name=me();const names=S.staff.map(s=>s.name);
  const sel=staffSelect({id:"who","aria-label":"เลือกชื่อ",onchange:e=>{LS.set("rd-me",e.target.value);renderMe()}},name,"— เลือกชื่อของคุณ —");
  box.append(el("div",{class:"me-head",style:"margin-bottom:12px"},el("h2",{style:"margin:0"},"ลงเวลา"),sel));
  if(!name||!names.includes(name)){box.append(el("p",{class:"sub"},"เลือกชื่อของคุณครั้งแรกครั้งเดียว เครื่องนี้จะจำไว้"));return}
  if(S.period!==periodOfToday()){box.append(el("p",{class:"note"},"กำลังดูรอบอื่นอยู่ ",el("button",{class:"btn",onclick:()=>load()},"กลับมารอบปัจจุบัน")));return}
  const myShop=shopOf(name);const mgr=isMgr(S.staff.find(s=>s.name===name));const isDuty=dutyOn(S.today,myShop)===name;const wk=!mgr&&!isDuty;const x=day(name,S.today);const lm=lateMin(name,S.today);const nd=nextDuty(name);
  box.append(el("div",{class:"today-type "+(isDuty?"duty":"norm")},
    el("div",{class:"note"},`โชว์รูม${myShop} · วัน${dayName(S.today)}ที่ ${dt(S.today).getDate()} ${TH_M[dt(S.today).getMonth()]}`),
    el("div",{class:"big"},x.status?`วันนี้${x.status}`+(x.note?`: ${x.note}`:""):isDuty?"วันนี้คุณเป็นเวร":mgr?"ผู้จัดการ · ไม่อยู่ในตารางเวร":"วันนี้คุณไม่เวร"),
    el("div",{class:"note"},mgr&&!x.status&&!isDuty?`เข้าไม่เกิน ${S.settings.mgrDeadline||"09:00"} น. (ตามเครื่องสแกน)`:isDuty&&!x.status?`เข้าไม่เกิน ${S.settings.deadline} น. (ตามเครื่องสแกน) · เปิด–ปิดโชว์รูม · ตรวจรถ`:x.auto?"วันหยุดปกติของผู้จัดการ ถ้ามาทำงาน กดเข้างานได้ตามปกติ":x.status?"ไม่ต้องลงเวลาเข้า–ออก":wk?`เข้าหลัง ${S.settings.normDeadline||"08:30"} น. (ตามเครื่องสแกน) นับสาย ไม่หักวัน`:"ลงเวลาเข้า–ออกตามปกติ"),
    el("div",{class:"note"},nd?`เวรครั้งถัดไป: ${rel(nd)}`:"")));
  if(!x.status||x.auto)box.append(el("div",{class:"times"},

function periodOfToday(){const d=dt(S.today);if(d.getDate()>=26)d.setMonth(d.getMonth()+1,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}

async function send(kind){
  const name=me();const pin=$("#pin").value.trim();if(!/^\d{4}$/.test(pin)){msg("ใส่ PIN ตัวเลข 4 หลัก");return}
  const needNote=["booth","off","leave"].includes(kind);const note=needNote?(($("#reason")||{}).value||"").trim():"";

  if(kind==="booth"&&!photoData){msg("แนบรูปบูธก่อนบันทึก");return}
  busy=true;msg("");renderMe();
  try{let c={};if(kind==="in"||kind==="out"){toast("กำลังหาตำแหน่ง…");c=await getPos()}

async function sendSwap(date,ret,cancel){

/* phones keep an old copy of the page (home-screen icon); check for a newer version and reload once if found */
const APP_VERSION="2026-11-27c";
